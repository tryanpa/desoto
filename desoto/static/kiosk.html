<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desoto Kiosk</title>
<link rel="stylesheet" href="theme.css">
<style>
 h1{margin:0;text-align:center;font-weight:900;font-size:clamp(2.4rem,6vw,4.6rem);line-height:1.05}
 .sub{color:var(--muted);font-weight:700;letter-spacing:.04em;margin-top:12px;text-align:center}
 .grid{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:1100px}
 .tile{min-width:150px;padding:18px 16px;font-size:.95rem}
 .tile:active{transform:scale(.97)}
 .queuebox{display:flex;flex-direction:column;align-items:center;gap:10px}
 .sim{display:flex;align-items:center;gap:10px}
 .sim .label{color:#444}
</style>
<div class="topbar"><div class="brand">Desoto<i>—</i>Kiosk</div><div class="clock" id="clock"></div>
 <div class="pill" id="pill"><span class="dot"></span><span id="pillText">…</span></div></div>
<main>
 <div><h1>Tap Your<br><span class="green">Name</span></h1>
 <div class="sub" id="sub">Join the line for the bathroom pass</div></div>
 <div class="queuebox"><div class="label">Queue — tap to leave</div><div class="grid" id="queue"></div></div>
 <div class="queuebox"><div class="label">Class roster</div><div class="grid" id="roster"></div></div>
</main>
<div class="footer"><span id="status">Waiting</span>
 <span class="sim"><span class="label">Simulator</span>
 <button class="ghost" onclick="sim(false)">Take pass</button><button class="ghost" onclick="sim(true)">Return pass</button></span></div>
<script src="common.js"></script>
<script>
const post = (u, b, m = "POST") => fetch(u, {method: m, headers: {"Content-Type": "application/json"}, body: b && JSON.stringify(b)});
const sim = d => post("/api/sim/docked", {docked: d});
startClock($("clock"));
let last = "";
function tile(text, cls, name, s) {
  const b = document.createElement("button");
  b.className = "tile " + cls; b.textContent = text;
  if (cls !== "out") b.onclick = () => s.queue.includes(name)
    ? post("/api/queue/" + encodeURIComponent(name), null, "DELETE") : post("/api/queue", {student: name});
  return b;
}
connect((s, left) => {
  setPill(s);
  $("status").textContent = s.out ? `${s.out.student} is out — ${fmt(left)}` : "Waiting — pass available";
  const key = JSON.stringify([s.queue, s.out, s.everyone]);
  if (key === last) return; last = key;
  $("queue").replaceChildren(...(s.queue.length
    ? s.queue.map((n, i) => tile(`${i + 1}. ${n}`, "queued", n, s))
    : [Object.assign(document.createElement("div"), {className: "sub", textContent: "Nobody waiting"})]));
  $("roster").replaceChildren(...s.everyone.map(n =>
    s.out && s.out.student === n ? tile(n + " · OUT", "out", n, s)
    : s.queue.includes(n) ? tile(n, "queued", n, s) : tile(n, "", n, s)));
});
</script>
