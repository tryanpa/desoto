<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desoto Kiosk</title>
<link rel="stylesheet" href="theme.css">
<script>if (new URLSearchParams(location.search).has("embed")) document.documentElement.classList.add("embed");</script>
<style>
 main{justify-content:flex-start;align-items:stretch;padding:14px 20px 16px;gap:14px;overflow:hidden}
 .head{display:flex;align-items:center;gap:18px;flex:none}
 h1{margin:0;font-weight:900;font-size:clamp(1.5rem,2.6vw,2.2rem);line-height:1.1}
 #back{min-height:52px;padding:0 22px}
 /* The tile grid fills all the space under the title. layout() picks columns/rows and sizes. */
 #main{flex:1;min-height:0;width:100%;display:grid;gap:12px;align-content:center;overflow-y:auto;scrollbar-width:none}
 .tile{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-width:0;padding:4px 10px;
  font-family:var(--head);font-weight:700;font-size:var(--fs,1rem);line-height:1.15;overflow-wrap:anywhere;border-radius:12px}
 .tile:active{transform:scale(.97)}
 .tile .pl{font-size:var(--pl,1rem);font-weight:800;letter-spacing:.2em;text-transform:uppercase;opacity:.75}
 .tile .pn{font-size:var(--pn,2rem);font-weight:900;line-height:1}
 .sim{display:flex;align-items:center;gap:10px}
 .sim .label{color:#444}
 #tapview{display:flex;flex-direction:column;gap:14px;flex:1;min-height:0}
 /* ID scan screen */
 #scanview{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;min-height:0}
 #scanview h1{font-size:clamp(2.4rem,6vw,4.6rem);line-height:1.05;text-align:center}
 .ready{display:inline-flex;align-items:center;gap:14px;padding:16px 30px;border:2px solid var(--border);border-radius:16px;background:var(--panel);color:var(--muted);font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:1.05rem}
 .ready i{font-style:normal;font-size:1.5rem}
 #scanMsg{min-height:5.2rem;width:min(760px,92%);display:flex;align-items:center;justify-content:center;padding:16px 26px;border-radius:14px;font-weight:800;font-size:clamp(1.1rem,2.4vw,1.7rem);line-height:1.3;visibility:hidden;border:2px solid transparent}
 #scanMsg.show{visibility:visible}
 #scanMsg.ok{background:var(--green-bg);color:var(--green);border-color:#285c3b}
 #scanMsg.info{background:#1d2b38;color:var(--blue);border-color:#2a4a66}
 #scanMsg.warn{background:var(--amber-bg);color:var(--amber);border-color:#5a4516}
 #scanMsg.bad{background:var(--red-bg);color:#ff8a7a;border-color:#5c2b27}
 #scanNext{color:var(--ink2,#b8b8b8);font-weight:700;font-size:1.15rem;min-height:1.5em}
 #scanTest{display:flex;align-items:center;gap:10px}#scanTest input{width:150px;padding:8px 10px}
 #susp{flex:none;text-align:center;background:var(--red-bg);border:2px solid var(--over,#e0533f);color:#ff8a7a;border-radius:12px;padding:12px 16px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;font-size:1.05rem}
 /* Popup: late return / blocked (only ever shown on the kiosk) */
 #popup{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.74);display:flex;align-items:center;justify-content:center;padding:24px}
 .pcard{width:min(760px,100%);background:var(--panel);border:3px solid var(--amber);border-radius:22px;padding:34px 40px;text-align:center}
 .pcard.debit,.pcard.block{border-color:var(--over,#e0533f)}
 .ptitle{font-weight:900;font-size:clamp(1.6rem,4vw,2.6rem);line-height:1.15}
 .pcard.warn .ptitle{color:var(--amber)}.pcard.debit .ptitle,.pcard.block .ptitle{color:#ff8a7a}
 .pbody{margin:16px 0 4px;font-weight:700;font-size:clamp(1.1rem,2.4vw,1.6rem);line-height:1.35;color:var(--text)}
</style>
<div class="topbar"><div class="brand">Desoto<i>—</i>Kiosk</div><div class="clock" id="clock"></div>
 <div class="pill" id="pill"><span class="dot"></span><span id="pillText">…</span></div></div>
<div id="popup" hidden role="alertdialog" aria-live="assertive">
 <div class="pcard warn" id="pcard"><div class="ptitle" id="ptitle"></div><div class="pbody" id="pbody"></div></div>
</div>
<main>
 <div id="susp" hidden>All passes have been suspended. Please see your teacher.</div>
 <div id="tapview">
  <div class="head"><button class="ghost" id="back" hidden onclick="show(null)">← Periods</button><h1 id="h1"></h1></div>
  <div id="main"></div>
 </div>
 <div id="scanview" hidden>
  <h1>Scan Your<br><span class="green">Student ID</span></h1>
  <div class="ready"><i>▩</i> Ready to scan</div>
  <div id="scanMsg" role="status" aria-live="polite"></div>
  <div id="scanNext"></div>
 </div>
</main>
<div class="footer"><span id="status">Waiting</span>
 <span id="scanTest" hidden><span class="label" style="color:#444">Simulator</span>
 <input id="testId" placeholder="Type an ID" autocomplete="off" inputmode="numeric"><button class="ghost" onclick="testScan()">Scan</button></span>
 <span class="sim" id="sim" hidden><span class="label">Simulator</span>
 <button class="ghost" onclick="sim(false)">Take pass</button><button class="ghost" onclick="sim(true)">Return pass</button></span></div>
<script src="common.js"></script>
<script>
const post = (u, b, m = "POST") => fetch(u, {method: m, headers: {"Content-Type": "application/json"}, body: b && JSON.stringify(b)});
const sim = d => post("/api/sim/docked", {docked: d});
startClock($("clock"));

let S = null, period = null, idle = null, last = "", leftNow = null;
const scanMode = () => !!S && S.settings.identify === "scan";

// ---- popup (late return, blocked). Closes on OK, a tap anywhere, or after 20 seconds.
const POPUP_MS = 5000;
let popupTimer = null, lateSeen = 0;
function showPopup(kind, title, body) {
  $("pcard").className = "pcard " + kind;
  $("ptitle").textContent = title; $("pbody").textContent = body;
  $("popup").hidden = false;
  clearTimeout(popupTimer); popupTimer = setTimeout(closePopup, POPUP_MS);
}
function closePopup() { $("popup").hidden = true; clearTimeout(popupTimer); }
$("popup").addEventListener("click", closePopup);
const lateText = sec => `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`;
function lateNotice(n) {
  if (!n || n.n === lateSeen) return;
  lateSeen = n.n;
  const taken = n.debited;
  showPopup(taken ? "debit" : "warn", `${n.student}, you are ${lateText(n.seconds)} late`,
    taken ? `${taken} extra pass${taken === 1 ? " was" : "es were"} taken from your pass bank. You have ${n.remaining} left.`
          : "If you continue to go over, your pass bank will be debited.");
}

// ---- ID scan mode: a USB scanner types the ID and presses Enter, like a very fast keyboard.
let idleTimer = null, wasScan = false, buf = "", times = [], lastCode = "", lastCodeAt = 0, msgTimer = null;
function showScan(res, status) {
  const ok = ["started", "returned"].includes(res.result);
  const cls = res.result === "returned" && res.over ? "warn" : ok ? "ok" : ["queued", "waiting"].includes(res.result) ? "info" : "bad";
  const m = $("scanMsg");
  m.textContent = res.message || "Something went wrong. Please see your teacher.";
  m.className = "show " + cls;
  clearTimeout(msgTimer); msgTimer = setTimeout(() => { m.className = ""; }, 7000);
}
function submitScan(code, typed) {
  const now = Date.now();
  if (code === lastCode && now - lastCodeAt < 1500) return;   // scanners often read a card twice
  lastCode = code; lastCodeAt = now;
  post("/api/scan", {id: code}).then(r => r.json().then(j => showScan(j, r.status)))
    .catch(() => showScan({result: "error", message: "Can't reach the pass server. Please see your teacher."}));
}
function finishScan() {
  clearTimeout(idleTimer);
  const code = buf, ts = times; buf = ""; times = [];
  if (code.length < 3) return;
  if (S.settings.scan_strict === "on" && ts.length >= 3 && (ts[ts.length - 1] - ts[0]) / (ts.length - 1) > 70) {
    showScan({result: "typed", message: "Please scan your card. Typing an ID is turned off."}); return;
  }
  submitScan(code);
}
function testScan() { const i = $("testId"); if (i.value.trim()) { submitScan(i.value.trim()); i.value = ""; } }
function onKey(e) {
  if (!scanMode()) return;
  if (e.target && e.target.id === "testId") { if (e.key === "Enter") { e.preventDefault(); testScan(); } return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const now = performance.now();
  if (e.key === "Enter" || e.key === "Tab") { e.preventDefault(); finishScan(); return; }
  if (e.key.length !== 1) return;
  if (times.length && now - times[times.length - 1] > 400) { buf = ""; times = []; }   // an old, unfinished entry
  buf += e.key; times.push(now); e.preventDefault();
  // Some scanners send no Enter after the ID: a short pause means the scan is finished.
  clearTimeout(idleTimer); idleTimer = setTimeout(finishScan, 200);
}
document.addEventListener("keydown", onKey);
// Split-screen page: it forwards scanner keystrokes here, whichever frame has focus.
window.addEventListener("message", ev => {
  const d = ev.data;
  if (ev.origin !== location.origin || !d || d.desoto !== "key") return;
  onKey({key: d.key, ctrlKey: d.ctrlKey, metaKey: d.metaKey, altKey: d.altKey, target: null, preventDefault() {}});
});
function renderScanStatus(left) {
  let t = "";
  if (S.called) {
    const rem = S.called.expires_at ? Math.max(0, S.called.expires_at - (Date.now() / 1000 + (window.srvOffset || 0))) : null;
    t = `Next: ${S.called.student}. Scan your ID to start` + (rem == null ? "." : ` (${fmt(rem)})`);
  } else if (S.out) t = `${S.out.student} is out (${fmt(left)}). ${S.queue.length ? S.queue.length + " waiting." : ""}`;
  else if (S.queue.length) t = `${S.queue.length} waiting.`;
  $("scanNext").textContent = t;
}
const same = (p, n, x) => x && x.period === p && x.student === n;
const el = (tag, cls, text) => Object.assign(document.createElement(tag), {className: cls, textContent: text});

// Step 1 = pick a period, step 2 = pick a name. Returns to step 1 after 20s idle.
function show(p) {
  period = p; last = "";
  clearTimeout(idle);
  if (p) idle = setTimeout(() => show(null), 20000);
  render();
}
let flash = "", flashTimer = null;
function say(msg) { flash = msg; clearTimeout(flashTimer); flashTimer = setTimeout(() => flash = "", 4000); }
function join(p, n) {
  post("/api/queue", {period: p, student: n}).then(r => r.json().then(st => {
    if (r.status === 409 && st.reason === "suspended") { showPopup("block", "All passes have been suspended", "Please see your teacher."); show(null); return; }
    if (r.status === 409 && st.reason) { showPopup("block", n, st.message.replace(n + ", ", "").replace(/^./, c => c.toUpperCase())); show(null); return; }
    say(`${n} added — #${st.queue.findIndex(q => same(p, n, q)) + 1} in line`); show(null); }));
}
function leave(p, n) {
  post("/api/queue/" + encodeURIComponent(p) + "/" + encodeURIComponent(n), null, "DELETE").then(() => { say(`${n} removed from line`); show(null); });
}

// Choose columns/rows so the tiles are as big as possible for the space (and the number of tiles),
// then size the text from the tile size. Tiles never get smaller than 52px tall: past that it scrolls.
function layout() {
  const g = $("main"), n = g.children.length;
  if (!n) return;
  const gap = 12, W = g.clientWidth, H = g.clientHeight, minH = 52, maxH = period ? 150 : 240;
  let best = null;
  for (let c = 1; c <= n; c++) {
    const r = Math.ceil(n / c), tw = (W - gap * (c - 1)) / c, raw = (H - gap * (r - 1)) / r, th = Math.min(maxH, Math.max(minH, raw));
    if (tw < 90) continue;
    // Score = the smaller side of the tile (names are happy being 1.5x wider than tall, period tiles want squares),
    // reduced when the last row is mostly empty. Ties go to more columns.
    const fits = raw >= minH, wide = period ? 1.5 : 1;
    const score = (fits ? 1 : 0.01) * Math.min(tw / wide, th) * (0.5 + 0.5 * n / (c * r));
    if (!best || score >= best.score) best = {c, r, tw, th, score};
  }
  if (!best) best = {c: 1, r: n, tw: W, th: minH};
  g.style.gridTemplateColumns = `repeat(${best.c}, minmax(0, 1fr))`;
  g.style.gridTemplateRows = `repeat(${best.r}, ${best.th}px)`;
  if (period) {
    const longest = Math.max(...S.roster[period].map(x => Math.max(...x.split(/\s+/).map(w => w.length))), 4);
    g.style.setProperty("--fs", Math.max(14, Math.min(best.th * 0.3, (best.tw - 28) / (longest * 0.66), 38)) + "px");
  } else {
    const len = Math.max(...Object.keys(S.roster).map(p => p.length), 1);
    g.style.setProperty("--pn", Math.max(28, Math.min(best.th * 0.5, (best.tw - 24) / (len * 0.7), 120)) + "px");
    g.style.setProperty("--pl", Math.max(12, Math.min(best.th * 0.14, 24)) + "px");
  }
}
window.addEventListener("resize", () => { if (S) layout(); });
if (document.fonts) document.fonts.ready.then(() => { if (S) layout(); });

function render() {
  if (!S) return;
  $("tapview").hidden = scanMode(); $("scanview").hidden = !scanMode();
  if (scanMode()) { wasScan = true; return; }
  if (wasScan) { wasScan = false; last = ""; period = null; }   // coming back from scan mode: rebuild and re-measure
  const key = JSON.stringify([S.queue, S.out, S.roster, period]);
  if (key === last) return; last = key;
  $("back").hidden = !period;
  if (!period) {
    $("h1").replaceChildren("Tap Your ", el("span", "green", "Class Period"));
    $("main").replaceChildren(...Object.keys(S.roster).map(p => {
      const b = el("button", "tile");
      b.append(el("span", "pl", "Period"), el("span", "pn", p));
      b.onclick = () => show(p); return b; }));
  } else {
    $("h1").replaceChildren("Period " + period + " — ", el("span", "green", "Tap Your Name"));
    $("main").replaceChildren(...S.roster[period].map(n => {
      if (same(period, n, S.out)) return el("button", "tile out", n + " · OUT");
      const pos = S.queue.findIndex(q => same(period, n, q)) + 1, queued = pos > 0;
      const b = el("button", "tile" + (queued ? " queued" : ""), queued ? `#${pos} · ${n}` : n);
      b.onclick = () => queued ? leave(period, n) : join(period, n); return b; }));
  }
  layout();
}
if (location.hash.length > 1) show(decodeURIComponent(location.hash.slice(1)));  // e.g. /#3 opens period 3
connect((s, left) => {
  S = s; leftNow = left; setPill(s); lateNotice(s.late_notice);
  $("susp").hidden = s.settings.passes_suspended !== "on";
  const controls = s.settings.test_controls === "show";   // Settings -> Simulator and test controls
  $("sim").hidden = !(controls && s.settings.simulator === "on" && !scanMode());   // Take pass / Return pass (tap mode)
  $("scanTest").hidden = !(controls && scanMode());                                // type-an-ID box (scan mode)
  if (scanMode()) renderScanStatus(left);
  $("status").textContent = flash ? flash : s.out ? `${s.out.student} is out — ${fmt(left)}` : "Waiting — pass available";
  render();
}, "kiosk");
</script>
