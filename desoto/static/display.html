<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desoto Display</title>
<link rel="stylesheet" href="theme.css">
<script>if (new URLSearchParams(location.search).has("embed")) document.documentElement.classList.add("embed");</script>
<style>
 .layout{flex:1;display:grid;grid-template-columns:1fr clamp(300px,28vw,440px);min-height:0}
 main{gap:36px;text-align:center}
 .label.big{font-size:clamp(1.3rem,2.8vw,2.4rem);color:#8a8a8a;letter-spacing:.3em}
 .label.big.red{color:var(--over,#e0533f)}
 .label.mid{font-size:clamp(.95rem,1.7vw,1.4rem);min-height:1.4em;color:#777}
 .who{font-weight:900;font-size:clamp(2.6rem,7vw,6rem);margin-top:8px}
 .count{font-family:var(--mono);font-weight:700;font-size:clamp(6rem,20vw,16rem);line-height:1;letter-spacing:.04em}
 .over{animation:blink 1s infinite}@keyframes blink{50%{opacity:.35}}
 .bar{position:relative;width:min(900px,60vw);height:36px;background:var(--panel2);border-radius:18px;overflow:hidden;margin:0 auto}
 .bar>div{height:100%;background:var(--green);transition:width .25s linear,background .25s}
 .bar .t{display:none}
 /* Settings → bar_style "pill": big pill with the time inside; the large digits above are hidden */
 .pill-bar .count{display:none}
 .pill-bar .bar{height:clamp(90px,16vh,150px);border-radius:999px;width:min(1000px,62vw);margin-top:28px;border:1px solid var(--border)}
 .pill-bar .bar .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:800;font-size:clamp(3rem,9vw,7.5rem);letter-spacing:.06em;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.45)}
 aside{background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
 aside .head{display:flex;justify-content:space-between;align-items:center;padding:22px 24px;border-bottom:1px solid var(--border)}
 aside .n{font-family:var(--mono);color:var(--green);font-weight:700}
 #list{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin;scrollbar-color:#444 transparent}
 .row{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--panel2);border:1px solid var(--border);border-radius:10px}
 .row .pos{font-family:var(--mono);color:var(--muted);font-weight:700;min-width:2ch}
 .row .nm{font-weight:800;font-size:1.15rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .row .pd{font-family:var(--mono);color:var(--muted);font-size:.85rem}
 .row.next{background:var(--green-bg);border-color:var(--green)}
 .row.next .pos,.row.next .nm{color:var(--green)}
 .row.next .nm{font-size:1.5rem}
 .tag{font-size:.65rem;letter-spacing:.2em;font-weight:800;color:var(--green);text-transform:uppercase}
 .empty{color:var(--muted);text-align:center;padding:32px 0;font-weight:700}
 @media (max-width:800px){html:not(.embed) .layout{grid-template-columns:1fr}html:not(.embed) aside{display:none}}
 html.embed .footer{display:none}
 html.embed .row .nm{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.15}
 html.embed .layout{grid-template-columns:1fr clamp(220px,32vw,420px)}
</style>
<div class="topbar"><div class="brand">Desoto<i>—</i>Display</div><div class="clock" id="clock"></div>
 <div class="pill" id="pill"><span class="dot"></span><span id="pillText">…</span></div></div>
<div class="layout">
 <main>
  <div><div class="label big" id="oLabel">Pass</div><div class="who" id="out"></div><div class="label mid" id="oSub"></div>
  <div class="count" id="count"></div><div class="bar" id="bar"><div id="fill"></div><span class="t" id="pt"></span></div></div>
 </main>
 <aside><div class="head"><div class="label">Queue</div><div class="n" id="qn"></div></div><div id="list"></div></aside>
</div>
<div class="footer" id="status">Waiting</div>
<script src="common.js"></script>
<script>
startClock($("clock"));
let lastQ = "";
const mk = (tag, cls, text) => Object.assign(document.createElement(tag), {className: cls, textContent: text});
function renderQueue(q) {
  const key = JSON.stringify(q); if (key === lastQ) return; lastQ = key;
  $("qn").textContent = q.length;
  $("list").replaceChildren(...(q.length ? q.map((p, i) => {
    const r = mk("div", "row" + (i ? "" : " next"));
    const mid = mk("div", "nm", p.student);
    if (!i) mid.append(mk("div", "tag", "Next up"));
    r.append(mk("div", "pos", i + 1), mid, mk("div", "pd", p.period ? "P" + p.period : ""));
    return r; }) : [mk("div", "empty", "Nobody waiting")]));
}
connect((s, left) => {
  setPill(s); renderQueue(s.queue);
  document.body.classList.toggle("pill-bar", s.settings.bar_style === "pill");
  if (s.out) {
    $("oLabel").textContent = "Out now"; $("out").textContent = s.out.student;
    $("oSub").textContent = left < 0 ? "Time over" : "Time remaining";
    $("count").textContent = fmt(left); $("count").className = "count " + tone(left, s.duration);
    // Over time the bar fills solid red and blinks (an empty bar would hide the colour).
    const pct = left < 0 ? 100 : Math.min(100, left / s.duration * 100);
    $("fill").style.width = pct + "%";
    $("bar").classList.toggle("over", left < 0); $("pt").textContent = fmt(left);
    $("fill").style.background = left < 0 ? "var(--red)" : left < warnAt(s.duration) ? "var(--amber)" : "var(--green)";
    $("status").textContent = left < 0 ? `Over time — ${s.out.student}` : `${s.out.student} is out`;
  } else if (s.settings.passes_suspended === "on") {
    // The red switch is on: nobody can take a pass.
    $("oLabel").textContent = "Passes suspended"; $("out").textContent = "See your teacher"; $("oSub").textContent = "";
    $("count").textContent = "✕"; $("count").className = "count red";
    $("fill").style.width = "100%"; $("fill").style.background = "var(--red)";
    $("bar").classList.remove("over"); $("pt").textContent = "✕";
  } else if (s.called) {
    // Scan mode: the pass is free and this student has been called. They scan their ID to start.
    const c = s.called, rem = c.expires_at ? Math.max(0, c.expires_at - (Date.now() / 1000 + (window.srvOffset || 0))) : null;
    $("oLabel").textContent = "Your turn"; $("out").textContent = c.student; $("oSub").textContent = "Scan your ID to start";
    $("count").textContent = rem == null ? "" : fmt(rem); $("count").className = "count " + (rem != null && rem < 15 ? "amber" : "green");
    $("fill").style.width = (rem == null ? 100 : Math.min(100, rem / c.window * 100)) + "%"; $("fill").style.background = "var(--green)";
    $("bar").classList.remove("over"); $("pt").textContent = rem == null ? "" : fmt(rem);
    $("status").textContent = `${c.student}: scan your ID to start`;
  } else {
    $("oLabel").textContent = "Pass"; $("out").textContent = "Available"; $("oSub").textContent = "";
    $("count").textContent = "✓"; $("count").className = "count green";
    $("fill").style.width = "100%"; $("fill").style.background = "var(--green)";
    $("bar").classList.remove("over"); $("pt").textContent = "✓";
    $("status").textContent = "Waiting — pass available";
  }
  const susp = s.settings.passes_suspended === "on";
  $("oLabel").classList.toggle("red", susp && !s.out);
  if (susp) $("status").textContent = "All passes have been suspended";
  if (s.notice) $("status").textContent = s.notice;
});
</script>
