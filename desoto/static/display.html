<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desoto Display</title>
<link rel="stylesheet" href="theme.css">
<style>
 .layout{flex:1;display:grid;grid-template-columns:1fr clamp(300px,28vw,440px);min-height:0}
 main{gap:36px;text-align:center}
 .who{font-weight:900;font-size:clamp(2.6rem,7vw,6rem);margin-top:8px}
 .count{font-family:var(--mono);font-weight:700;font-size:clamp(6rem,20vw,16rem);line-height:1;letter-spacing:.04em}
 .over{animation:blink 1s infinite}@keyframes blink{50%{opacity:.35}}
 .bar{width:min(900px,60vw);height:10px;background:var(--panel2);border-radius:6px;overflow:hidden;margin:0 auto}
 .bar>div{height:100%;background:var(--green);transition:width .25s linear}
 aside{background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
 aside .head{display:flex;justify-content:space-between;align-items:center;padding:22px 24px;border-bottom:1px solid var(--border)}
 aside .n{font-family:var(--mono);color:var(--green);font-weight:700}
 #list{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin;scrollbar-color:#444 transparent}
 .row{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--panel2);border:1px solid var(--border);border-radius:10px}
 .row .pos{font-family:var(--mono);color:var(--muted);font-weight:700;min-width:2ch}
 .row .nm{font-weight:800;font-size:1.15rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .row .pd{font-family:var(--mono);color:var(--muted);font-size:.85rem}
 .row.next{background:var(--green-bg);border-color:var(--green)}
 .row.next .pos,.row.next .nm{color:var(--green)}
 .row.next .nm{font-size:1.5rem}
 .tag{font-size:.65rem;letter-spacing:.2em;font-weight:800;color:var(--green);text-transform:uppercase}
 .empty{color:var(--muted);text-align:center;padding:32px 0;font-weight:700}
 @media (max-width:800px){.layout{grid-template-columns:1fr}aside{display:none}}
</style>
<div class="topbar"><div class="brand">Desoto<i>—</i>Display</div><div class="clock" id="clock"></div>
 <div class="pill" id="pill"><span class="dot"></span><span id="pillText">…</span></div></div>
<div class="layout">
 <main>
  <div><div class="label" id="oLabel">Pass</div><div class="who" id="out"></div><div class="label" id="oPeriod"></div>
  <div class="count" id="count"></div><div class="bar"><div id="fill"></div></div></div>
 </main>
 <aside><div class="head"><div class="label">Queue</div><div class="n" id="qn"></div></div><div id="list"></div></aside>
</div>
<div class="footer" id="status">Waiting</div>
<script src="common.js"></script>
<script>
startClock($("clock"));
let lastQ = "";
const mk = (tag, cls, text) => Object.assign(document.createElement(tag), {className: cls, textContent: text});
function renderQueue(q) {
  const key = JSON.stringify(q); if (key === lastQ) return; lastQ = key;
  $("qn").textContent = q.length;
  $("list").replaceChildren(...(q.length ? q.map((p, i) => {
    const r = mk("div", "row" + (i ? "" : " next"));
    const mid = mk("div", "nm", p.student);
    if (!i) mid.append(mk("div", "tag", "Next up"));
    r.append(mk("div", "pos", i + 1), mid, mk("div", "pd", p.period ? "P" + p.period : ""));
    return r; }) : [mk("div", "empty", "Nobody waiting")]));
}
connect((s, left) => {
  setPill(s); renderQueue(s.queue);
  if (s.out) {
    $("oLabel").textContent = "Out now"; $("out").textContent = s.out.student;
    $("oPeriod").textContent = s.out.period ? "Period " + s.out.period : "";
    $("count").textContent = fmt(left); $("count").className = "count " + tone(left);
    const pct = Math.max(0, Math.min(100, left / s.duration * 100));
    $("fill").style.width = pct + "%";
    $("fill").style.background = left < 0 ? "var(--red)" : left < 120 ? "var(--amber)" : "var(--green)";
    $("status").textContent = left < 0 ? `Over time — ${s.out.student}` : `${s.out.student} is out`;
  } else {
    $("oLabel").textContent = "Pass"; $("out").textContent = "Available"; $("oPeriod").textContent = "";
    $("count").textContent = "✓"; $("count").className = "count green";
    $("fill").style.width = "100%"; $("fill").style.background = "var(--green)";
    $("status").textContent = "Waiting — pass available";
  }
});
</script>
